# Standalone stack for the Crucible search companion. Mirrors the block enrolled in the
# context-control home-compose fleet (compose.home.yml), so `docker compose up` here and
# `home-compose up crucible-search` there bring up the same services.
#
# JSON API only, no UI. Unauthenticated with full index write access, so every published
# port is scoped to loopback rather than all interfaces.
services:
  crucible-search:
    build:
      context: .
      args:
        GIT_SHA: ${CRUCIBLE_GIT_SHA:-unknown}
    container_name: crucible-search
    restart: unless-stopped
    # 1g, not 512m: the vector leg holds one Float32Array of chunks x dim. At 1024d over the
    # current 52,257-chunk index that is ~214MB resident on top of the Node baseline and
    # SQLite's page cache. See plans/semantic-vector-leg-and-reranker.md.
    mem_limit: 1g
    ports:
      - "127.0.0.1:4801:4801"
    environment:
      CRUCIBLE_SEARCH_PORT: 4801
      CRUCIBLE_SEARCH_HOST: 0.0.0.0
      CRUCIBLE_SEARCH_DB: /data/search.sqlite
    volumes:
      - crucible-search-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4801/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Embeddings backend for Crucible's semantic search leg. Infinity (michaelfeil/infinity) is
  # a text-embeddings-inference-style CPU server; Crucible's existing `openai-compatible`
  # provider kind speaks its OpenAI-compatible /v1/embeddings endpoint as-is (zero plugin
  # changes). --url-prefix /v1 makes the served path match that convention exactly; the
  # provider's base URL must be configured as http://127.0.0.1:4802/v1 (the client appends
  # "/embeddings" itself).
  #
  # mem_limit 12g, raised from 4g at bring-up after a MEASURED memcg OOM rather than an estimate:
  # the container was killed four times at anon-rss 4,064,176kB under
  # constraint=CONSTRAINT_MEMCG, and was still climbing when it hit the wall. That peak is not
  # steady-state inference — it is optimum's one-time ONNX graph-optimization pass over bge-m3's
  # onnx/model.onnx (568M-param XLM-RoBERTa-large), which holds the source graph and the
  # optimized copy simultaneously. Measured steady state after that pass is ~5.0GiB.
  #
  # Why 12g and not 8g, which did boot: at 8g the cgroup's memory.peak came to rest at exactly
  # 8589934592 — the limit, to the byte — with 11,121 memory.max reclaim events. It survived by
  # reclaiming flat against the wall, not with headroom. That is fine until the cache volume is
  # cleared or the model changes and the optimization pass reruns, at which point 8g is a coin
  # flip. This is a ceiling, not a reservation: raising it costs nothing while nothing uses it.
  # Do not trim back toward the bare-weights figure (~2.1GB fp32) — that number describes the
  # wrong phase of startup, and 4g demonstrably does not boot at all.
  #
  # Diagnostic note for whoever hits this next: `docker inspect` reports OOMKilled=false and
  # exit=0, because the kernel kills the infinity_emb child rather than PID 1 — Docker never
  # sets the flag. dmesg is the only honest source.
  # See plans/semantic-vector-leg-and-reranker.md WP-4 for the full trail.
  #
  # cpus 16 is throughput headroom, not correctness — sized for a 24-logical-core box. The
  # full-vault backfill runs for hours and would otherwise saturate every core; measured
  # embedding scaling is already near-flat past 12 threads (3.8/s at 1, 10.3/s at 4, 20.1/s at
  # 12), so the ceiling costs little. Delete the line to let a backfill run flat out, or raise
  # it on a larger box.
  crucible-embedder:
    image: michaelf34/infinity:0.0.77-cpu
    container_name: crucible-embedder
    restart: unless-stopped
    mem_limit: 12g
    cpus: 16
    ports:
      - "127.0.0.1:4802:4802"
    command:
      - "v2"
      - "--model-id"
      - "BAAI/bge-m3"
      - "--port"
      - "4802"
      - "--device"
      - "cpu"
      - "--engine"
      - "optimum"
      - "--url-prefix"
      - "/v1"
    volumes:
      - crucible-embedder-cache:/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4802/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # Reranking backend for WP-5's opt-in reranker. Same image, a second model, a second
  # instance (these servers host one model each). No --url-prefix: Infinity's default is an
  # unprefixed /rerank, and WP-5's provider client builds "{baseUrl}/rerank" directly — so the
  # reranker provider's base URL is configured as http://127.0.0.1:4803 (no /v1 suffix).
  # Verified request/response shape: POST /rerank {model, query, documents} ->
  # {results:[{index, relevance_score}], ...}. mem_limit matches the embedder for the same
  # architecture-family reasons above.
  #
  # --engine torch, NOT optimum, and this is not a tuning preference — it is the only engine
  # that can load this model. optimum resolves ONNX weights from the HF repo, and
  # BAAI/bge-reranker-v2-m3 publishes PyTorch weights only, so `--engine optimum` dies during
  # engine selection with "ValueError: No onnx files found for BAAI/bge-reranker-v2-m3", before
  # it downloads a single byte (the tell: a 56KB cache volume next to the embedder's 4.3GB).
  # It fails identically at any mem_limit. The embedder above legitimately keeps optimum because
  # bge-m3 DOES ship onnx/model.onnx — the two services differ here for a reason, so do not
  # "align" them in either direction without checking which weights each repo actually
  # publishes. Note the image bakes INFINITY_ENGINE=optimum into its env; the explicit CLI flag
  # is what overrides it.
  crucible-reranker:
    image: michaelf34/infinity:0.0.77-cpu
    container_name: crucible-reranker
    restart: unless-stopped
    mem_limit: 8g
    ports:
      - "127.0.0.1:4803:4803"
    command:
      - "v2"
      - "--model-id"
      - "BAAI/bge-reranker-v2-m3"
      - "--port"
      - "4803"
      - "--device"
      - "cpu"
      - "--engine"
      - "torch"
    volumes:
      - crucible-reranker-cache:/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4803/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  crucible-search-data:
  crucible-embedder-cache:
  crucible-reranker-cache:
